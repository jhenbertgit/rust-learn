name: Deploy course to GitHub Pages

# Builds the static site in dist/ and publishes it with GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". No branch is published directly, no gh-pages branch is created.
#
# The workflow refuses to deploy a course whose lessons do not compile: verify.mjs
# builds every snippet in every chapter and compares the output against what the
# lesson claims before anything is published.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify lessons, then build the site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Show the toolchain
        run: |
          node --version
          rustc --version
          cargo --version

      # Runners ship rustc without the documentation component, which the lesson
      # verifier uses to confirm that every docs link points at a real chapter.
      # If this cannot be installed, verify.mjs checks link shape only.
      - name: Install the offline docshelf
        continue-on-error: true
        run: rustup component add rust-docs

      - name: Verify every snippet against the compiler
        env:
          VERIFY_REQUIRE_TOOLCHAIN: "1"
        run: node scripts/verify.mjs

      - name: Build the static site
        run: node scripts/build-static.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Creates the Pages site on first run instead of failing with
          # "Get Pages site failed" when nobody has clicked the toggle yet.
          enablement: true

      - name: Upload the artifact Pages will serve
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: verify-and-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
