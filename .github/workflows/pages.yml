name: Deploy course to GitHub Pages

# Builds the static site in dist/ and publishes it with GitHub Pages.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". No branch is published directly, no gh-pages branch is created.
#
# The workflow refuses to deploy a course whose lessons do not compile: verify.mjs
# builds every snippet in every chapter and compares the output against what the
# lesson claims before anything is published.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Verify lessons, then build the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show the toolchain
        run: |
          node --version
          rustc --version
          cargo --version

      - name: Verify every snippet against the compiler
        env:
          VERIFY_REQUIRE_TOOLCHAIN: "1"
        run: node scripts/verify.mjs

      - name: Build the static site
        run: node scripts/build-static.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the artifact Pages will serve
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
